[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "falling-ball-viscometer"
version = "1.1.2"
description = "落球法液体黏度自动测量系统 — 基于机器视觉自动追踪与误差修正"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "huangdouding"},
]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "PySide6>=6.11",
]

[project.urls]
Repository = "https://github.com/huangdouding/falling-ball-viscometer-"

[project.scripts]
viscometer-gui = "gui_app:main"
viscometer-cli = "main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["**/*"]
